<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Primary SEO -->
  <title>AP World History Hub – Study Guides, Quizzes & Practice Exams</title>
  <meta name="description" content="Comprehensive AP World History resources including detailed study guides, unit quizzes, flashcards, and exam practice. Prepare for the AP exam with interactive tools and detailed content." />
  <meta name="keywords" content="AP World History, AP World, world history study guide, AP exam prep, AP World quizzes, AP World practice tests" />
  <link rel="canonical" href="https://yourdomain.com/" />
  <!-- Mobile Optimization -->
  <meta name="theme-color" content="#111827" />
  <!-- Open Graph (Facebook, LinkedIn, etc.) -->
  <meta property="og:title" content="AP World History Hub – Study Guides, Quizzes & Practice Exams" />
  <meta property="og:description" content="Comprehensive AP World History resources including detailed study guides, unit quizzes, flashcards, and exam practice." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://yourdomain.com/" />
  <meta property="og:image" content="https://yourdomain.com/og-image.png" />
  <meta property="og:locale" content="en_US" />
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="AP World History Hub – Study Guides, Quizzes & Practice Exams" />
  <meta name="twitter:description" content="Comprehensive AP World History resources including detailed study guides, unit quizzes, flashcards, and exam practice." />
  <meta name="twitter:image" content="https://yourdomain.com/og-image.png" />
  <!-- Structured Data (JSON‑LD) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "url": "https://yourdomain.com/",
    "name": "AP World History Hub",
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://yourdomain.com/search?q={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>
  <!-- Favicon -->
  <link rel="icon" href="/favicon.ico" />
</head>
<body>
  <div id="root"></div>
</body>
</html>
